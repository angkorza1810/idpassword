<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<title>VaultAI Password Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed glass sidebar + main column; dashboard = centre work area + right security rail, over a deep-space starfield. Single deliberate dark look. */
:root{
  --space:#030B24; --space-2:#061436; --glass:#112954; --glass-a:rgba(17,41,84,.55); --glass-b:rgba(17,41,84,.32);
  --line:rgba(0,223,255,.16); --line-2:rgba(0,223,255,.32);
  --blue:#007BFF; --cyan:#00DFFF; --violet:#7049FF; --mint:#00DCB3; --warn:#FFB547; --danger:#FF5C7A;
  --fg:#EAF4FF; --fg-2:#A9BEDC; --fg-3:#6F87AD;
  --f-display:"Sora","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Sora",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --r-s:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--space);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 45% at 62% 0%,rgba(0,123,255,.28),transparent 70%),
  radial-gradient(40% 40% at 100% 30%,rgba(112,73,255,.22),transparent 70%),
  radial-gradient(45% 50% at 0% 100%,rgba(112,73,255,.18),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(6,20,54,.88),rgba(3,11,36,.92));backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand .orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fe9ff,var(--blue) 55%,#1a1170);box-shadow:0 0 22px rgba(0,223,255,.55);position:relative;flex:none}
.brand .orb::after{content:"";position:absolute;inset:16px -8px;border:2px solid rgba(160,240,255,.75);border-radius:50%;transform:rotate(-22deg)}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.2px}
.brand b span{color:var(--cyan)}
.brand small{display:block;font-size:9.5px;letter-spacing:2.4px;color:var(--fg-3);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.cat-link{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-s);background:none;text-align:left;color:var(--fg-2);font-size:14px}
.nav button:hover,.cat-link:hover{background:rgba(0,123,255,.12);color:var(--fg)}
.nav button.on{background:linear-gradient(90deg,var(--blue),rgba(0,123,255,.35));color:#fff;box-shadow:0 0 18px rgba(0,123,255,.45)}
.nav svg{width:19px;height:19px;flex:none}
.side h4{margin:4px 12px 2px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.cat-link .dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:none}
.cat-link .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--fg-3);background:rgba(255,255,255,.05);padding:1px 7px;border-radius:99px}
.cat-link.on{color:var(--fg);background:rgba(0,223,255,.1)}
.addcat{color:var(--cyan)!important}
.companion{margin-top:auto;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(160deg,rgba(0,123,255,.25),rgba(112,73,255,.18));display:flex;gap:12px;align-items:center}
.companion .bot{width:46px;height:46px;flex:none}
.companion b{font-family:var(--f-display);font-size:13px;display:block}
.companion span{font-size:12px;color:var(--fg-2)}

/* main */
.main{min-width:0;padding:22px 28px 40px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:14px;justify-content:flex-end}
.icon-btn.menu-btn{display:none;margin-right:auto}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass-b);display:grid;place-items:center;color:var(--fg-2)}
.icon-btn:hover{color:var(--cyan);border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px}
.user{display:flex;align-items:center;gap:10px}
.user .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--blue));display:grid;place-items:center;font-weight:600;color:var(--space)}
.user b{display:block;font-size:13px}.user small{color:var(--fg-3);font-size:11px}
select.role{background:var(--glass-b);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:11px;color:var(--fg-2)}

.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(12px)}
.panel{padding:20px}
.panel-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.panel-h svg{width:22px;height:22px;color:var(--cyan);flex:none;margin-top:2px}
.panel-h h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.panel-h p{margin:2px 0 0;color:var(--fg-3);font-size:12.5px}
.panel-h .act{margin-left:auto}
.chip-btn{border:1px solid var(--line-2);background:rgba(0,123,255,.08);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--fg)}
.chip-btn:hover{background:rgba(0,123,255,.22)}

.dash{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero h1{margin:0;font-family:var(--f-display);font-size:clamp(26px,3.2vw,36px);font-weight:600;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--fg-2)}
.hero p b{color:var(--cyan);font-weight:500}
.search{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;border-radius:99px;border:1.5px solid rgba(0,223,255,.45);background:rgba(6,20,54,.7);box-shadow:0 0 26px rgba(0,123,255,.3),inset 0 0 18px rgba(0,123,255,.15)}
.search svg{width:20px;height:20px;color:var(--cyan);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.search input::placeholder{color:var(--fg-3)}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:6px;padding:2px 7px;color:var(--fg-2)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qa{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1px solid var(--line-2);text-align:left;color:#fff;transition:transform .15s,box-shadow .15s}
.qa:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,123,255,.35)}
.qa .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.qa .ic svg{width:22px;height:22px}
.qa b{display:block;font-family:var(--f-display);font-weight:600;font-size:14.5px}
.qa span{font-size:12px;opacity:.85}
.qa.p{background:linear-gradient(120deg,var(--blue),#2aa6ff)}
.qa.c{background:linear-gradient(120deg,#4b3bd6,var(--violet))}
.qa.n{background:linear-gradient(120deg,var(--glass),rgba(17,41,84,.6))}
.qa.n .ic{background:var(--warn);color:var(--space)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.catcard{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);color:var(--fg);min-height:150px}
.catcard:hover{border-color:var(--line-2)}
.catcard[data-cat]{cursor:pointer}
.catcard .mini a{display:inline-flex;border-radius:7px;transition:transform .15s}.catcard .mini a:hover{transform:translateY(-2px);box-shadow:0 0 10px rgba(0,223,255,.6)}
a.golink{color:inherit;text-decoration:none;border-radius:10px}a.golink:hover b{color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
a.btn{text-decoration:none;color:inherit}.btn.login{border-color:rgba(0,220,179,.45);color:var(--mint)}.btn.login:hover{color:#fff;background:rgba(0,220,179,.2);border-color:var(--mint)}
.catcard .t{display:flex;gap:10px;align-items:center;font-weight:500;line-height:1.3}
.catcard .mini{display:flex;gap:6px;flex-wrap:wrap}
.catcard small{color:var(--fg-3);margin-top:auto}
.catcard.all{align-items:center;justify-content:center;text-align:center;font-weight:500}
.catcard.all svg{width:34px;height:34px;color:var(--cyan)}

/* item icon */
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;flex:none;overflow:hidden;font-size:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ico.s{width:26px;height:26px;border-radius:7px;font-size:12px}
.ico.l{width:64px;height:64px;border-radius:16px;font-size:28px}
.ico img{width:100%;height:100%;object-fit:cover}
.ico.emoji{background:rgba(255,255,255,.08)!important;font-size:20px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,.9fr) auto;align-items:center;gap:14px;padding:11px 6px;border-top:1px solid rgba(0,223,255,.08)}
.row:first-child{border-top:0}
.row:hover{background:rgba(0,123,255,.06)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small,.muted{color:var(--fg-3);font-size:12.5px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acts{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line-2);background:rgba(6,20,54,.6);font-size:12.5px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(120deg,var(--blue),#2aa6ff);border-color:transparent;color:#fff;font-weight:500}
.btn.primary:hover{color:#fff;box-shadow:0 0 18px rgba(0,123,255,.5)}
.btn.danger{border-color:rgba(255,92,122,.4);color:var(--danger)}
.btn.ghost{border-color:transparent;background:none;padding:7px 8px}

/* right rail */
.secure{padding:20px;display:flex;flex-direction:column;gap:14px;border-color:rgba(0,220,179,.35)}
.secure .top{display:flex;gap:14px;align-items:center}
.secure svg{width:46px;height:46px;color:var(--mint);flex:none;filter:drop-shadow(0 0 10px rgba(0,220,179,.6))}
.secure b{font-family:var(--f-display);font-size:16px}
.secure p{margin:2px 0 0;font-size:12px;color:var(--fg-2)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--cyan));box-shadow:0 0 10px var(--mint);transition:width .3s}
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:1px;background:var(--line-2)}
.ev{display:grid;grid-template-columns:12px 38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0}
.ev .pt{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--cyan);position:relative}
.ev .box{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg-2)}
.ev .box svg{width:17px;height:17px}
.ev b{font-weight:500;font-size:13.5px;display:block}
.ev small{color:var(--fg-3);font-size:12px}
.ev .tm{text-align:right;font-size:12.5px;white-space:nowrap}
.ev .tm small{display:block;font-family:var(--f-mono);font-size:11px}
.pwbox{display:flex;gap:10px}
.pwfield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 14px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:rgba(3,11,36,.6);font-family:var(--f-mono);font-size:15px;letter-spacing:1px}
.pwfield span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strength{font-size:13px;margin:12px 0 8px}
.pick{width:100%;margin-bottom:12px;background:rgba(3,11,36,.6);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:flex;gap:14px;align-items:center;padding:16px;text-align:left;color:var(--fg);border:1px solid var(--line)}
.stat .ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:24px;height:24px}
.stat small{display:block;color:var(--fg-2);font-size:12px}
.stat b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--fg-3)}

/* vault page */
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead h1{margin:0;font-family:var(--f-display);font-size:28px;font-weight:600}
.pagehead p{margin:4px 0 0;color:var(--fg-2)}
.pagehead .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--glass-b);border-radius:99px;padding:6px 12px;font-size:12.5px;color:var(--fg-2);display:inline-flex;gap:6px;align-items:center}
.fchip.on{border-color:var(--cyan);color:var(--fg);background:rgba(0,223,255,.12)}
.vrow{grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,.9fr) 300px}
.vrow .acts{justify-content:flex-end}
.secret{font-family:var(--f-mono);font-size:12.5px;color:var(--fg-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.05);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag i{width:7px;height:7px;border-radius:50%;flex:none}
.empty{padding:36px;text-align:center;color:var(--fg-3)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--fg-3);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid rgba(0,223,255,.07);vertical-align:middle}
td.mono{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.pill{display:inline-block;white-space:nowrap;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid}
.pill.ok{color:var(--mint);border-color:rgba(0,220,179,.4)}
.pill.warn{color:var(--warn);border-color:rgba(255,181,71,.4)}
.pill.bad{color:var(--danger);border-color:rgba(255,92,122,.4)}
.pill.info{color:var(--cyan);border-color:var(--line-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.setting{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid rgba(0,223,255,.08)}
.setting:first-of-type{border-top:0}
.setting div{flex:1;min-width:0}
.setting b{display:block;font-weight:500}
.setting small{color:var(--fg-3)}
.switch{width:46px;height:26px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.08);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg-3);transition:.2s}
.switch.on{background:rgba(0,220,179,.3);border-color:var(--mint)}
.switch.on::after{left:23px;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.note{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.08);color:#ffd9a0;font-size:13px}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(1,5,18,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{width:min(620px,100%);background:linear-gradient(170deg,#0b1d45,#06143a);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(0,123,255,.2);padding:24px}
.modal h2{margin:0 0 4px;font-family:var(--f-display);font-size:20px}
.modal .sub{color:var(--fg-3);margin:0 0 18px;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fg-2);min-width:0}
.inp{width:100%;background:rgba(3,11,36,.7);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:14px}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,223,255,.15)}
textarea.inp{min-height:80px;resize:vertical}
.inrow{display:flex;gap:8px}
.inrow .inp{flex:1;min-width:0}
.mono{font-family:var(--f-mono)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(3,11,36,.7);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-size:13px;color:var(--fg-2)}
.seg button.on{background:var(--blue);color:#fff}
.iconpick{display:flex;gap:16px;align-items:flex-start;padding:14px;border-radius:14px;border:1px dashed var(--line-2);background:rgba(0,123,255,.05)}
.iconpick .opts{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.swatches,.emojis{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff}
.em{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:17px;padding:0}
.em.on{border-color:var(--cyan);background:rgba(0,223,255,.15)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:11px 18px;border-radius:12px;background:#0b2a5c;border:1px solid var(--cyan);box-shadow:0 0 24px rgba(0,223,255,.35);font-size:13.5px;transition:opacity .25s}
.lock{position:fixed;inset:0;z-index:90;background:rgba(3,11,36,.94);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.lock svg{width:64px;height:64px;color:var(--cyan);filter:drop-shadow(0 0 14px var(--cyan))}
.lock h2{margin:0;font-family:var(--f-display)}

.sync{background:none;cursor:pointer;white-space:nowrap}
.syncbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,181,71,.4);background:rgba(255,181,71,.08)}
.syncbar div{flex:1;min-width:200px}.syncbar b{display:block;color:#ffd9a0;font-weight:500}.syncbar small{color:var(--fg-2)}
.lc-body{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qrbox{width:164px;height:164px;padding:8px;border-radius:14px;background:#fff;flex:none;box-shadow:0 0 24px rgba(0,223,255,.25)}
.qrbox img,.qrbox canvas{width:148px!important;height:148px!important;display:block}
.lc-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}

async function copyText(txt,label,it){
  try{await navigator.clipboard.writeText(txt);toast('คัดลอก'+label+'แล้ว'+(S.settings.clip?` • ล้างใน ${S.settings.clip} วินาที`:''))}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('คัดลอก'+label+'แล้ว')}catch(_){toast('คัดลอกไม่ได้ ข้อความถูกเลือกไว้ให้กด Ctrl+C')}ta.remove()}
  if(it){it.lastUsed=now();log('copy','คัดลอก'+label,it.name);render()}
  if(S.settings.clip){setTimeout(()=>{navigator.clipboard?.writeText?.('').catch(()=>{})},S.settings.clip*1000)}
}
const can=act=>({Admin:['view','add','edit','share','delete'],Manager:['view','add','edit','share'],Employee:['view']})[S.role].includes(act);
function guard(act){if(can(act))return true;toast(`สิทธิ์ ${S.role} ทำรายการนี้ไม่ได้`);return false}
const secretOf=it=>it.type==='note'?it.notes:it.pass;
const href=u=>{u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u};
const host=u=>{try{const x=new URL(href(u));return x.hostname.replace(/^www\./,'')+(x.pathname.length>1?x.pathname.replace(/\/$/,''):'')}catch(e){return u}};

function drawQRs(){if(!window.QRCode)return;[['qr-main',SHARE_URL],['qr-dl',SHARE_URL+'#download']].forEach(([id,u])=>{const el=document.getElementById(id);if(!el)return;el.innerHTML='';try{new QRCode(el,{text:u,width:148,height:148,colorDark:'#030B24',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}})}
async function saveQR(id){const c=document.querySelector('#'+id+' canvas');if(!c)return toast('QR ยังไม่พร้อม');
  const out=document.createElement('canvas');out.width=out.height=520;const x=out.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,520,520);x.imageSmoothingEnabled=false;x.drawImage(c,40,40,440,440);
  const blob=await new Promise(r=>out.toBlob(r,'image/png'));const dl=await cap('downloads');
  if(!dl)return toast('บันทึกไฟล์ไม่ได้ในหน้านี้ ใช้คลิกขวาที่ QR แล้วบันทึกรูปแทน');
  try{await dl.save({filename:id==='qr-dl'?'vaultai-download-qr.png':'vaultai-link-qr.png',data:blob});toast('บันทึก QR แล้ว')}catch(e){if(e?.code!=='declined')toast('บันทึก QR ไม่สำเร็จ')}}
function render(){
  renderSide();
  const v=S.view;const m=document.getElementById('main');
  m.innerHTML=syncBar()+(v==='dashboard'?dashboard():['vault','passwords','notes'].includes(v)?vault():v==='share'?shareView():v==='team'?team():v==='activity'?activity():settings());
  if(v==='share')drawQRs();
  scheduleAutoPublish();
  save();
}

const imgCache={};
function loadImg(src){return imgCache[src]||(imgCache[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src}))}
const THEMES={
  dark:{bg:'#030B24',bg2:'#0b1d45',fg:'#EAF4FF',fg2:'#A9BEDC',fg3:'#6F87AD',line:'rgba(0,223,255,.18)',accent:'#00DFFF',card:'rgba(17,41,84,.55)'},
  light:{bg:'#FFFFFF',bg2:'#EEF4FF',fg:'#0A1A3A',fg2:'#3D5275',fg3:'#7286A6',line:'#D5E0F2',accent:'#007BFF',card:'#F5F8FE'}};
const FT='"IBM Plex Sans Thai","Sora",sans-serif',FD='"Sora","IBM Plex Sans Thai",sans-serif',FM='"JetBrains Mono",monospace';
function fit(x,t,w){t=String(t??'');if(x.measureText(t).width<=w)return t;while(t.length&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
async function buildReport(list,opt){
  await Promise.all(['400 20px "IBM Plex Sans Thai"','600 20px "IBM Plex Sans Thai"','600 20px "Sora"','400 20px "JetBrains Mono"'].map(f=>document.fonts.load(f).catch(()=>0)));
  for(const i of list)if(i.icon?.kind==='image')await loadImg(i.icon.value);
  const T=THEMES[opt.theme],W=1240,PH=1754,M=70;
  const blocks=[{k:'head',h:230}];
  S.cats.concat([{id:'',name:'ไม่มีหมวด',color:'#6F87AD',emoji:'📁'}]).forEach(c=>{const its=list.filter(i=>(i.cat||'')===c.id||(!c.id&&!S.cats.some(k=>k.id===i.cat)));if(!its.length)return;
    blocks.push({k:'cat',h:78,c,n:its.length});its.forEach(i=>blocks.push({k:'row',h:i.notes?118:96,i}))});
  const draw=async(x,bl,H,pageNo,pages)=>{
    x.fillStyle=T.bg;x.fillRect(0,0,W,H);
    if(opt.theme==='dark'){const g=x.createRadialGradient(W*.7,0,10,W*.7,0,900);g.addColorStop(0,'rgba(0,123,255,.28)');g.addColorStop(1,'rgba(0,123,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
    let y=M;x.textBaseline='alphabetic';
    for(const b of bl){
      if(b.k==='head'){
        const g=x.createRadialGradient(M+26,y+20,4,M+30,y+30,34);g.addColorStop(0,'#7fe9ff');g.addColorStop(.6,'#007BFF');g.addColorStop(1,'#1a1170');x.fillStyle=g;x.beginPath();x.arc(M+30,y+30,30,0,7);x.fill();
        x.fillStyle=T.fg;x.font='700 40px '+FD;x.fillText('Vault',M+76,y+44);const vw=x.measureText('Vault').width;x.fillStyle=T.accent;x.fillText('AI',M+76+vw,y+44);
        x.fillStyle=T.fg3;x.font='500 15px '+FD;x.fillText('PASSWORD MANAGER • รายงานคลังรหัสผ่าน',M+78,y+70);
        x.fillStyle=T.fg;x.font='600 30px '+FT;x.fillText(opt.title,M,y+130);
        x.fillStyle=T.fg2;x.font='400 19px '+FT;
        x.fillText(`ส่งออกเมื่อ ${new Date().toLocaleString('th-TH',{dateStyle:'long',timeStyle:'short'})} • ${list.length} รายการ • โดย ${S.role}`,M,y+164);
        x.fillStyle=opt.secrets?'#FF5C7A':T.fg3;x.font='500 16px '+FT;
        x.fillText(opt.secrets?'⚠ เอกสารนี้มีรหัสผ่านจริง ห้ามส่งต่อหรือพิมพ์ทิ้งไว้':'รหัสผ่านถูกซ่อนไว้ ดูรหัสจริงได้ในเว็บ VaultAI',M,y+194);
        x.fillStyle=T.line;x.fillRect(M,y+b.h-14,W-2*M,2);
      }else if(b.k==='cat'){
        x.fillStyle=b.c.color;rrect(x,M,y+22,40,40,10);x.fill();x.font='22px '+FT;x.textAlign='center';x.fillStyle='#fff';x.fillText(b.c.emoji,M+20,y+50);x.textAlign='left';
        x.fillStyle=T.fg;x.font='600 23px '+FT;x.fillText(b.c.name,M+56,y+50);const nw=x.measureText(b.c.name).width;
        x.fillStyle=T.fg3;x.font='400 17px '+FT;x.fillText(`${b.n} รายการ`,M+70+nw,y+50);
      }else{
        const i=b.i;x.fillStyle=T.card;rrect(x,M,y+4,W-2*M,b.h-12,14);x.fill();
        const ix=M+18,iy=y+22,is=48,ic=i.icon||{};
        if(ic.kind==='image'){const im=await loadImg(ic.value);x.save();rrect(x,ix,iy,is,is,12);x.clip();if(im)x.drawImage(im,ix,iy,is,is);x.restore()}
        else if(ic.kind==='emoji'){x.fillStyle=opt.theme==='dark'?'rgba(255,255,255,.08)':'#E6EEFB';rrect(x,ix,iy,is,is,12);x.fill();x.font='26px '+FT;x.textAlign='center';x.fillStyle=T.fg;x.fillText(ic.value,ix+is/2,iy+35);x.textAlign='left'}
        else{x.fillStyle=ic.color||'#334155';rrect(x,ix,iy,is,is,12);x.fill();x.fillStyle='#fff';x.font='700 21px '+FD;x.textAlign='center';x.fillText((ic.value||'?').slice(0,2),ix+is/2,iy+32);x.textAlign='left'}
        const c1=M+84,c2=M+520,c3=M+810,rw=W-M-18;
        x.fillStyle=T.fg;x.font='600 20px '+FT;x.fillText(fit(x,i.name,c2-c1-20),c1,y+42);
        x.fillStyle=T.accent;x.font='400 15px '+FM;x.fillText(fit(x,i.url?href(i.url):(i.type==='note'?'Secure note':''),c2-c1-20),c1,y+68);
        x.fillStyle=T.fg3;x.font='500 12px '+FT;x.fillText('ชื่อผู้ใช้',c2,y+32);x.fillText(i.type==='note'?'เนื้อหา':'รหัสผ่าน',c3,y+32);
        x.fillStyle=T.fg;x.font='400 17px '+FT;x.fillText(fit(x,i.type==='note'?'—':(i.user||'—'),c3-c2-20),c2,y+58);
        const sec=secretOf(i)||'';x.font='400 17px '+FM;
        x.fillText(fit(x,!sec?(i.type==='note'?'—':i.nopass?'ไม่ต้องใช้รหัส':'ยังไม่ใส่รหัส'):opt.secrets?sec.replace(/\n/g,' / '):'••••••••••',rw-c3),c3,y+58);
        if(i.notes&&i.type!=='note'){x.fillStyle=T.fg2;x.font='400 15px '+FT;x.fillText(fit(x,'หมายเหตุ: '+i.notes.replace(/\n/g,' '),rw-c1),c1,y+96)}
        else if(i.notes){x.fillStyle=T.fg2;x.font='400 15px '+FT;x.fillText(fit(x,opt.secrets?i.notes.replace(/\n/g,' / '):'(ซ่อนเนื้อหาโน้ต)',rw-c1),c1,y+96)}
      }
      y+=b.h;
    }
    x.fillStyle=T.fg3;x.font='400 14px '+FT;x.fillText('VaultAI • สร้างจากต้นแบบ ข้อมูลเป็นความลับของบริษัท',M,H-40);
    if(pages){x.textAlign='right';x.fillText(`หน้า ${pageNo}/${pages}`,W-M,H-40);x.textAlign='left'}
  };
  // PNG: one tall image
  const fullH=M+blocks.reduce((a,b)=>a+b.h,0)+90;
  const full=document.createElement('canvas');full.width=W;full.height=fullH;await draw(full.getContext('2d'),blocks,fullH);
  // PDF: A4 pages
  const groups=[[]];let y=M;
  for(const b of blocks){if(y+b.h>PH-100&&groups.at(-1).length){groups.push([]);y=M}groups.at(-1).push(b);y+=b.h}
  const pages=[];for(let n=0;n<groups.length;n++){const c=document.createElement('canvas');c.width=W;c.height=PH;await draw(c.getContext('2d'),groups[n],PH,n+1,groups.length);pages.push(c)}
  return {full,pages};
}
function exportList(scope){return S.items.filter(i=>scope==='all'||(scope==='view'?viewFilter(i):i.cat===scope))}
function viewFilter(i){const f=S.filter;const tl={passwords:'password',notes:'note'}[S.view];const type=tl||f.type;const q=f.q.trim().toLowerCase();
  return (f.cat==='all'||i.cat===f.cat)&&(type==='all'||i.type===type)&&(!q||[i.name,i.url,i.user,i.notes,cat(i.cat).name].join(' ').toLowerCase().includes(q))}
function exportModal(){

      $('#x-info').textContent=`${list.length} รายการ • PDF ${rep.pages.length} หน้า (A4) • PNG ภาพเดียวยาว`};

/* ---------- paste import: fills passwords on this device from the team's text format ---------- */
const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9ก-๙]/g,'');
function parseCreds(text){
  const out=[];
  text.split('📍').slice(1).forEach(block=>{
    const lines=block.split('\n').map(l=>l.trim()).filter(l=>l&&!/^[—\-_=]{3,}/.test(l));
    if(!lines.length)return;
    let title=lines[0],user='',pass='',note='',url='';
    const tm=title.match(/^(.+?)\s*:\s*(.+)$/);if(tm&&!/^https?:/i.test(tm[2])){title=tm[1];user=tm[2]}
    title=title.replace(/\s*\(.*?\)\s*/g,' ').trim();
    const tnote=(lines[0].match(/\((.+?)\)/)||[])[1];if(tnote)note=tnote;
    const plain=[];
    lines.slice(1).forEach(l=>{
      let m;
      if((m=l.match(/^(user(name)?|e-?mail|ไอดี|id|อีเมล)\s*[:=]\s*(.*)$/i)))user=m[3].trim();
      else if((m=l.match(/^(pass(word)?|พาส|รหัส(ผ่าน)?)\s*[:=]\s*(.*)$/i))){let v=m[4].trim();const pm=v.match(/^(\S+)\s+\((.+)\)$/);if(pm){v=pm[1];note=pm[2]}pass=v}
      else if(/https?:\/\//i.test(l)){if(!url)url=(l.match(/https?:\/\/\S+/)||[''])[0];const rest=l.replace(/https?:\/\/\S+/,'').trim();if(rest)note=rest}
      else if(/^[\w.@+-]+$/.test(l)&&!user)user=l;
      else plain.push(l);
    });
    if(/ไม่ต้องใส่รหัส/.test(block))note='ไม่ต้องใส่รหัส';
    out.push({title,user,pass,url,note});
  });
  return out;
}
function matchCred(c,used){
  const t=norm(c.title);
  const cands=S.items.filter(i=>!used.has(i.id)&&(norm(i.name)===t||norm(i.name).startsWith(t)||t.startsWith(norm(i.name))));
  return cands.find(i=>c.user&&i.user===c.user)||cands.find(i=>c.url&&host(i.url).split('/')[0]===host(c.url).split('/')[0])||cands[0]||null;
}
function importModal(){

    <textarea class="inp mono" id="im-text" style="min-height:220px;font-size:12.5px" placeholder="📍IG&#10;User : ...&#10;Pass : ..."></textarea>
    <div id="im-prev" style="margin-top:12px"></div>
    <div class="mfoot"><button class="btn left" data-close>ยกเลิก</button><button class="btn primary" id="im-go" disabled>นำเข้า</button></div>`,el=>{

    go.onclick=()=>{let np=0,nn=0;

        else{S.items.push({id:uid(),type:'password',name:c.title,url:c.url,user:c.user,pass:c.pass,cat:S.filter.cat!=='all'?S.filter.cat:S.cats[0]?.id,icon:{kind:'letter',value:c.title.slice(0,1).toUpperCase(),color:'#007BFF'},notes:c.note||'',updated:now(),lastUsed:0,nopass:c.note==='ไม่ต้องใส่รหัส'||undefined});nn++;if(c.pass)np++}
      });
      log('edit','นำเข้ารายการจากข้อความ',`${np} รหัส • ${nn} รายการใหม่`);closeModal();render();toast(`ใส่รหัสแล้ว ${np} รายการ${nn?` • เพิ่มใหม่ ${nn}`:''}`)};
    setTimeout(()=>ta.focus(),40);
  });
}
async function downloadHTML(withPw){
  const dl=await cap('downloads');if(!dl)return toast('บันทึกไฟล์ไม่ได้ในหน้านี้');
  const doc=buildDoc({rev:now(),at:now(),...sharedPart(withPw)});
  try{await dl.save({filename:'VaultAI-'+new Date().toISOString().slice(0,10)+'.html',data:doc});toast('บันทึกเว็บลงเครื่องแล้ว เปิดไฟล์ด้วยเบราว์เซอร์ได้เลย')}
  catch(e){if(e?.code!=='declined')toast('บันทึกไฟล์ไม่สำเร็จ')}
}

  if(D.toggle){S.settings[D.toggle]=!S.settings[D.toggle];log('settings','เปลี่ยนการตั้งค่า',D.toggle);render();return}

  if(D.delmember){if(!guard('delete'))return;const m=S.members.find(x=>x.id===D.delmember);return confirmBox('ลบ '+m.name+'?','สมาชิกจะเข้าถึงรายการที่แชร์ไม่ได้อีก',()=>{S.members=S.members.filter(x=>x!==m);render()})}
  if(D.endsess){S.sessions=S.sessions.filter(s=>s.id!==D.endsess);log('login','ออกจากระบบอุปกรณ์อื่น','');render();toast('ออกจากระบบอุปกรณ์นั้นแล้ว');return}

  if(a==='focus-search')return focusSearch();
  if(a==='reveal'){const sel=document.getElementById('preview-select');const it=item(sel.value);const t=document.getElementById('pv-text');const on=t.dataset.on==='1';
    t.textContent=on?'•'.repeat(13):(secretOf(it)||'ยังไม่ได้ใส่รหัส');t.dataset.on=on?'0':'1';b.innerHTML=ic(on?'eyeoff':'eye');if(!on){it.lastUsed=now();log('view','เปิดดูรหัสผ่าน',it.name)}return}
  if(a==='clearlog'){if(!guard('delete'))return;return confirmBox('ล้างประวัติทั้งหมด?','ประวัติการใช้งานจะถูกลบจากเครื่องนี้',()=>{S.log=[];render()},'ล้าง')}
  if(a==='addmember'){if(!guard('share'))return;return simpleForm('เชิญสมาชิก',[{id:'m-name',l:'ชื่อ'},{id:'m-email',l:'อีเมล',t:'email'},{id:'m-role',l:'บทบาท',opts:[['Employee','Employee'],['Manager','Manager'],['Admin','Admin']]}],v=>{if(!v['m-name']||!v['m-email']){toast('กรอกชื่อและอีเมล');return false}S.members.push({id:uid(),name:v['m-name'],email:v['m-email'],role:v['m-role'],status:'invited'});log('share','เชิญสมาชิก',v['m-email'])})}

  if(a==='export'){const json=JSON.stringify(S);openModal(`<h2>ส่งออกข้อมูล</h2><p class="sub">คัดลอกข้อความนี้ไปเก็บในที่ปลอดภัย</p><textarea class="inp mono" id="ex-txt" style="min-height:220px;font-size:11px" readonly>${esc(json)}</textarea><div class="mfoot"><button class="btn" data-close>ปิด</button><button class="btn primary" id="ex-copy">${ic('copy')}คัดลอกทั้งหมด</button></div>`,el=>el.querySelector('#ex-copy').onclick=()=>{const t=el.querySelector('#ex-txt');t.select();copyText(json,'ข้อมูล')});return}
  if(a==='import'){openModal(`<h2>นำเข้าข้อมูล</h2><p class="sub">วาง JSON ที่ส่งออกไว้ ข้อมูลปัจจุบันจะถูกแทนที่</p><textarea class="inp mono" id="im-txt" style="min-height:200px;font-size:11px"></textarea><div class="mfoot"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="im-ok">นำเข้า</button></div>`,el=>el.querySelector('#im-ok').onclick=()=>{try{const d=JSON.parse(el.querySelector('#im-txt').value);if(!d.items||!d.cats)throw 0;S=d;closeModal();render();toast('นำเข้าแล้ว')}catch(_){toast('รูปแบบ JSON ไม่ถูกต้อง')}});return}
  if(a==='reset'){return confirmBox('รีเซ็ตทั้งหมด?','ข้อมูลที่คุณเพิ่มเองในเครื่องนี้จะหายไป',()=>{S=seed();render();toast('รีเซ็ตแล้ว')},'รีเซ็ต')}

/* ---------- starfield ---------- */
(function(){const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,st=[];const red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;st=Array.from({length:Math.round(innerWidth*innerHeight/5000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3*devicePixelRatio+.2,p:Math.random()*6.28,s:.005+Math.random()*.02}))}
  function draw(){x.clearRect(0,0,W,H);for(const s of st){s.p+=s.s;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));x.fillStyle=s.r>1.2?'#9fe9ff':'#ffffff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}if(!red)requestAnimationFrame(draw)}
  addEventListener('resize',size);size();draw()})();

if(!S.log.some(e=>e.a==='login'&&now()-e.at<HR))log('login','เข้าสู่ระบบ',device());
